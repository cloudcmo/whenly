[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# daily-report is no longer scheduled here: Whenly's numbers now ride in the
# combined four-game report sent by the Pub Quiz Daily site (its daily-report
# function reads this site's blobs via WHENLY_SITE_ID). The function file
# stays for on-demand use, it just never fires on its own.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

